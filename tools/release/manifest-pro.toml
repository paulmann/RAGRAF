# RAGRAF Pro — манифест поставки закрытого издания.
#
# Задача, из которой он появился (ПРОМТ-И15, 25.10.2026). Издание Pro было
# объявлено в `editions/editions.toml` и не существовало как поставка: у него не
# было ни своего состава, ни проверяльщика, ни гейта. «Объявлено» без артефакта —
# это обещание, а не продукт: проверить, что войдёт в руки покупателя, было нечем.
#
# Модель издания, измеренная, а не выбранная по вкусу:
#
#   * сборка ОДНА. Возможности платных изданий написаны и лежат в том же дереве
#     (`edition_baseline.json`, статус `shipped`: `quality-loop` — Pro, `sso`,
#     `siem-export`, `offline-license`, `attestation` — Enterprise). Что из них
#     работает, решает ПОДПИСАННЫЙ файл лицензии, а не другой бинарник: гейт
#     `src/ragraf/edition.py` отказывает операции вне издания ДО её выполнения;
#   * пакет Pro отличается от Community ЗАКРЫТЫМИ материалами (`pro/**`) и
#     лицензией. Тот же код, другие права — и это не оговорка, а измеряемое
#     свойство: `--manifest` Pro собирает надмножество Community, а привязка
#     лицензии проверяется прогоном `tools/release/check_pro_delivery.py` в
#     собранном дереве;
#   * почему не «вырезать платный код из Community и положить только сюда» —
#     названо в `pro/PRO-DELIVERY.md` §5: `edition.py` и `signing.py` импортируются
#     при загрузке фасада (без них установка не запускается), а `quality.py`
#     используется Community-операцией `index_status`. Резать по файлу там нечего.
#
# Почему наследование, а не копия правил. Копия шестидесяти включений и тридцати
# исключений расходится на первой правке, и расхождение не видно глазами: сборка
# Pro просто перестала бы совпадать с Community по составу. Поэтому состав
# Community берётся из его манифеста (`inherits`), а здесь объявляется только
# ДОБАВКА — ровно то, чего в Community нет.

[release]
product = "RAGRAF Pro"
inherits = "tools/release/manifest.toml"
# Закрытые модули издания (ПРОМТ-И15). Это ОДНО объявление делает две вещи:
#   * возвращает путь в поставку Pro, хотя исключение Community его ловит
#     (`relcommon.collect` считает такие пути отдельно от отсечённых);
#   * требует, чтобы в Community-сборке файла НЕ БЫЛО (`check_pro_delivery.py`).
# Второе — не формальность: без него объявление «закрытого модуля» ничего не
# закрывает, и файл тихо уехал бы в бесплатную поставку.
#
# Почему не копия в `pro/`: две копии одного файла расходятся на первой правке,
# и в поставке оказался бы код, не совпадающий с проверенным.
pro_only = [
    "src/ragraf/shared_index.py",
    "tests/test_shared_index.py",
    "src/ragraf/sso.py",
    "src/ragraf/siem.py",
    "src/ragraf/attest.py",
    "src/ragraf/license_offline.py",
    "tests/test_external_access.py",
    "tests/test_offline_attest.py",
    "src/ragraf/quality_loop.py",
    "tests/test_quality_loop.py",
]

# ---------------------------------------------------------------------------
# Закрытые материалы Pro.
#
# Каталог `pro/` объявлен удерживающим в `editions/editions.toml`
# (`[retained]`): в публикацию Community он не входит никогда. Здесь он
# публикуется — потому что это и есть та часть, за которую платят: документ
# поставки и машинный инвентарь прав (`pro/inventory.toml`), который сверяется
# с `edition_baseline.json` свойством, а не обещанием.
# ---------------------------------------------------------------------------

[[include]]
from = "pro"
to = "pro"
kind = "tree"

# ---------------------------------------------------------------------------
# Чего в поставке Pro быть не может ни при каком расширении этого файла:
#
#   * секретоносные пути (`catalog/db_access.json`, `catalog/secrets.key`,
#     лицензии и ключи подписи) — они не входят ни в одну поставку;
#   * локальные настройки этой машины (`config/*.local.*`);
#   * материалы Enterprise (`enterprise/**`): они принадлежат другому изданию и
#     удержаны объявлением, а не забыты.
#
# Первые два класса отсекаются унаследованными правилами и проверяются отдельно
# (`check_pro_delivery.py`, свойство «секретоносных путей нет»); третий — тем,
# что `enterprise/` в этот манифест не включён: у файла есть место, и это место
# объявлено удержанным.
# ---------------------------------------------------------------------------
