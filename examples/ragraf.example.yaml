# Example RAGRAF corpus configuration.
#
# This is a TEMPLATE, not a working config: the `root` path below is a stub.
# Your config for a concrete project is created by the command that inspects the
# directory and picks languages, exclusions and thresholds from the actual contents:
#
#     ragraf init C:\path\to\project
#
# The command prints the path of the created file. After init, check two lists —
# `include` and `exclude`: they decide what lands in the index. Pay special
# attention to directories with secrets (`config.local.*`, `.env`, keys) — they
# must not be indexed.
#
# Then register and build the index:
#
#     ragraf -p examples/mycorpus.yaml register
#     ragraf -p examples/mycorpus.yaml index
#
# Or everything in one command (find the corpus, rebuild a stale index, create a
# corpus for an unknown directory):
#
#     ragraf ensure C:\path\to\project
#
# Where the index ends up: in the `.ragraf/` directory INSIDE the indexed project.
# That is machine-local derived data — add `.ragraf/` to that repository's
# .gitignore.

project: myproject
root: C:/path/to/your/project

# Languages whose files land in the index. Tree parsing (graph nodes and edges)
# is available for 16 languages; the rest are attached as text — files are
# findable by search but yield no nodes. The full list is in README.md.
#
# The `init` command fills this list from the directory's actual contents.
# If the project has .ps1, .sh, .bat scripts or .cs, .py, .pl code — make sure
# their languages are here, otherwise the files are not indexed.
languages:
  - python
  - javascript
  - markdown

# What to index: file masks. The defaults below are for a Python project.
include:
  - "**/*.py"
  - "**/*.js"
  - "**/*.md"

# What to exclude. The base list (history, dependencies, build, caches, and the
# .ragraf directory itself) ALWAYS applies and is not replaced by this list:
# rules from here are ADDED to the base ones.
# NOTE: matching is case-sensitive (known limitation, roadmap R-CORE-1) —
# on Windows list both cases when in doubt (**/cache/** and **/Cache/**).
exclude:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/build/**"
  - "**/dist/**"

# Files with secrets: not indexed, contents not read.
secrets_exclude:
  - "**/*.local.php"
  - "**/.env"
  - "**/*.pem"

# DB schema from migrations (when the project has migrations/*.sql).
db:
  enabled: false

embedding:
  # The model is local, works without the cloud. ~240 MB, downloaded once at the
  # first indexing with vectors into <home>/.ragraf/models.
  # Override the cache directory: the RAGRAF_MODEL_CACHE environment variable.
  # Indexing without the model: ragraf index --no-vectors (lexicon keeps working).
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
  batch_size: 64
  use_gpu: false
  device: auto

chunking:
  by_symbol: true
  max_chunk_lines: 120
  min_chunk_lines: 3

index:
  # How many revisions to keep. Old ones are not deleted from history: they are
  # marked rotated; only the graph and lexicon data is cleaned.
  retain_revs: 3
  batch_size: 2000
  # The code property graph (interprocedural calls) requires Java and Joern.
  # Without them the index still builds, but capability=degraded: the slice
  # operation refuses with a reason, the rest work.
  joern_enabled: true
  joern_server: true
  joern_server_port: 9500
  joern_heap_gb: 8
  # Auto-tuning of reindex thresholds by accumulated edits.
  reindex_after_changes: 5
  full_reindex_after_changes: 20
  reindex_interval_minutes: 15
