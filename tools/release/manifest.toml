# ---------------------------------------------------------------------------
# 12. Классы файлов tools/ (ПРОМТ-И14, 25.10.2026).
#
# Зачем. В tools/ 348 файлов .py, и читатель не отличал проверку от разового
# патча: `final_cleanup_excludes.py` и `check_line_refs.py` выглядели одинаково.
# У каждого файла теперь ровно один класс:
#
#   working — рабочая проверка или точка входа продукта: её вызывает гейт
#             (tools/Invoke-ProjectDoctrine.ps1), напрямую или через импорт;
#   oneoff  — разовый инструмент этапа: написан под конкретный вопрос и
#             воротами не является.
#
# Правило класса — ДОСТИЖИМОСТЬ ОТ ГЕЙТА, а не имя файла. Это измерено, а не
# предположено: 7 файлов с «разовым» именем `check_*` (check_bom_crlf,
# check_licensing, check_line_refs, check_release_manifest, check_skill_variants,
# check_community_wrapper, check_db_layer) гейт вызывает, и назвать их разовыми
# значило бы соврать ровно в том месте, где читатель ищет защиту.
#
# Группы oneoff объявлены причинами: имя файла начинается с темы, и тема
# называет, зачем инструмент писался. Новый файл с незнакомой темой попадает в
# «не объявлен» и валит проверку — так список групп не устаревает молча.
#
# Честная оговорка, которая проверяется числом. Поставка пока несёт каталог
# tools/ целиком, поэтому разовый инструмент в неё ИДЁТ. Это названо здесь
# (`oneoff_shipped_now`) и сверяется обходом: разошлось число — находка.
# Исключать их из поставки в этом этапе нельзя: 47 разовых инструментов
# названы командами в публикуемых документах, и исключение сделало бы эти
# команды невыполнимыми. Решение о выносе — отдельное, с правкой документов.
# ---------------------------------------------------------------------------

[tools_classes]
gate = "tools/Invoke-ProjectDoctrine.ps1"
# Измерено 25.10.2026 на rev-0291: файлов 349, рабочих 15 (13 от гейта, включая
# tools/check_tools_classes.py, и две личные записи ниже), разовых 334, не объявлено 0.
# Числа не вписаны руками в проверку: их печатает обход, а объявление сверяется с ним.
oneoff_shipped_now = 334
note = """Разовый инструмент объявлен группой темы; класс рабочего определяется
достижимостью от гейта, поэтому «рабочий по имени» невозможен по построению."""

[[tools_classes.group]]
prefixes = ["check_", "diag_", "audit_", "verify_", "compare_", "find_"]
reason = """Сверка разового результата: проверка написана под конкретный вопрос
(конкретная база, конкретный корпус, конкретный отчёт) и в ворота не входит."""

[[tools_classes.group]]
prefixes = ["measure_", "bench_", "probe_", "analyze_", "phase0_", "trace_",
            "tune_", "recalc_", "count_", "scan_", "recon_"]
reason = """Замер и стенд: даёт число этапа, а не решение о пригодности. Порог
окупаемости и пороги переиндексации менялись по таким замерам."""

[[tools_classes.group]]
prefixes = ["fix_", "add_", "patch_", "insert_", "merge_", "append_",
            "renumber_", "extend_", "enable_", "install_", "setup_", "clean_",
            "run_", "build_", "replace_", "plan_", "update_", "refine_",
            "rollback_", "harness_"]
reason = """Правка дерева, конфигов или данных под конкретный этап: одноразовое
действие, которое нельзя повторять на чужом корпусе без разбора."""

[[tools_classes.group]]
prefixes = ["final_", "collect_", "summary_", "extract_", "gen_", "snapshot_",
            "sync_", "link_", "remember_", "offline_"]
reason = """Сбор фактов, снимок состояния или пересылка данных: обслуживает
отчёт этапа, а не проверяет продукт."""

[[tools_classes.manual]]
path = "tools/keep_cut.py"
class = "working"
reason = """Копия ДО удаления (правило владельца 24.10.2026): инструмент, на который
опирается инвариант 23, хотя гейт его не вызывает."""

[[tools_classes.manual]]
path = "tools/ragraf-mcp-http.py"
class = "working"
reason = """Точка входа HTTP-сервера MCP: поверхность продукта, а не разовый скрипт."""
