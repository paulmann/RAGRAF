# RAGRAF — набор задач для замеров M1 / M3 / M6
#
# ВАЖНО (ACCEPTANCE.md §1): задачи фиксируются ДО внедрения индекса. Задача,
# придуманная после просмотра ответов индекса, в зачёт не идёт. Baseline
# снимается без индекса (только rg и чтение файлов), затем тот же набор —
# с индексом.
#
# Формат задачи:
#   id           — идентификатор
#   type         — navigation | relations | schema | edit | doc
#   question     — формулировка, которую получает агент
#   expected     — что обязано быть в правильном ответе (составлено по коду)
#   metric       — какая метрика снимается
#   baseline_hint — как решать без индекса (для воспроизводимости baseline)

tasks:
  # ---------- навигация ----------
  - id: T-01
    type: navigation
    metric: [M1]
    question: "Где обрабатывается HTTP-запрос настройки и откуда берутся значения?"
    expected:
      - "src/Http/Controllers/SettingsController.php"
      - "метод-обработчик с указанием строки"
      - "источник значений: App\\Core\\Config"
    baseline_hint: "rg -n 'SettingsController' и последовательное чтение"

  - id: T-02
    type: navigation
    metric: [M1]
    question: "Где формируется ответ API и какие поля он отдаёт?"
    expected:
      - "src/Http/Response.php"
      - "метод json"
    baseline_hint: "rg -n 'function json'"

  - id: T-03
    type: navigation
    metric: [M1]
    question: "Где реализован механизм постановки задачи в очередь воркеров?"
    expected:
      - "src/Jobs/JobRepository.php"
      - "src/Pipeline/PipelineEngine.php"
    baseline_hint: "rg -n 'revoap_jobs'"

  # ---------- связи ----------
  - id: T-04
    type: relations
    metric: [M1, M3]
    question: "Кто вызывает Config::get и что изменится, если поменять его сигнатуру?"
    expected:
      - "список вызывающих файлов с указанием строк"
      - "минимум 100 мест вызова (по индексу: 301 доказанная связь)"
    baseline_hint: "rg -n '->get' — даёт сотни совпадений без привязки к Config"

  - id: T-05
    type: relations
    metric: [M1, M3]
    question: "Кого вызывает PipelineEngine::run и на какие сервисы он опирается?"
    expected:
      - "список вызываемых методов с файлами"
      - "разделение на доказанные и эвристические связи"
    baseline_hint: "чтение файла на 1 218 строк и выписывание вызовов вручную"

  - id: T-06
    type: relations
    metric: [M1]
    question: "Какие классы наследуются от одного базового класса и где он объявлен?"
    expected:
      - "объявление базового класса"
      - "наследники (расширения)"
    baseline_hint: "rg -n 'extends '"

  # ---------- schema ----------
  - id: T-07
    type: schema
    metric: [M1, M6]
    question: "Что известно о таблице revoap_jobs и где она читается и пишется?"
    expected:
      - "файлы с SQL-обращениями к таблице"
      - "символы-владельцы с указанием строк"
    baseline_hint: "rg -n 'revoap_jobs'"

  - id: T-08
    type: schema
    metric: [M1]
    question: "Какие обращения к базе делаются из слоя истории сессий?"
    expected:
      - "src/History/* — файлы и SQL-обращения"
    baseline_hint: "rg -n 'SELECT|INSERT|UPDATE' src/History"

  # ---------- правки ----------
  - id: T-09
    type: edit
    metric: [M3, M6]
    question: "Добавь новый параметр конфигурации с значением по умолчанию и использованием в одном модуле."
    expected:
      - "правка в модуле конфигурации"
      - "правка в модуле-потребителе"
      - "отсутствие сломанных вызовов"
    baseline_hint: "поиск места объявления настроек и места использования"

  - id: T-10
    type: edit
    metric: [M3, M5]
    question: "Вынеси повторяющийся блок в отдельный приватный метод и обнови вызовы."
    expected:
      - "новый приватный метод"
      - "обновлённые вызовы"
      - "регистрация slice_boundary в журнале после правки"
    baseline_hint: "поиск дублирующихся фрагментов вручную"

  - id: T-11
    type: edit
    metric: [M3]
    question: "Добавь фильтр по статусу в выборку задач воркера."
    expected:
      - "изменение SQL или условия фильтрации"
      - "минимум файлов, не затронуть публичные контракты"
    baseline_hint: "поиск выборки задач и её потребителей"

  # ---------- impact ----------
  - id: T-12
    type: relations
    metric: [M2, M6]
    question: "Что затронет переименование публичного метода Config::get?"
    expected:
      - "все файлы-потребители с указанием строк"
      - "оценка: сколько мест требует правки"
    baseline_hint: "rg по имени метода"

  - id: T-13
    type: relations
    metric: [M2]
    question: "Что затронет добавление обязательной колонки в таблицу задач?"
    expected:
      - "все места вставки в таблицу"
      - "все места чтения"
    baseline_hint: "rg по имени таблицы"

  # ---------- документация ----------
  - id: T-14
    type: doc
    metric: [M1, M6]
    question: "Что в документации проекта сказано о слое истории сессий?"
    expected:
      - "md-файлы с упоминанием модуля"
      - "связь документа с классом"
    baseline_hint: "rg -n 'история|History' --glob '*.md'"

# Порядок проведения
procedure:
  1: "Зафиксировать этот файл (хеш) — изменения после начала замеров недопустимы."
  2: "Baseline: агент решает задачи БЕЗ MCP-сервера (только rg и чтение файлов)."
  3: "Опыт: тот же набор, первый шаг — ragraf_index_status и ragraf_drift_report."
  4: "Для каждой задачи записать: число tool-вызовов, число прочитанных файлов и строк, токены контекста, результат."
  5: "M1: доля задач с первого запроса. M3: медиана токенов и вызовов. M6: доля валидных ссылок."
