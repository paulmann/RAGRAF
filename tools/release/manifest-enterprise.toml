# RAGRAF Enterprise — манифест поставки закрытого издания.
#
# Задача, из которой он появился (ПРОМТ-И16, 25.10.2026). Издание Enterprise было
# объявлено в `editions/editions.toml` со статусом `declared`, и в папке
# `enterprise/` лежал один README: «объявлено» без артефакта — это обещание, а не
# продукт. Проверить, что войдёт в руки покупателя, было нечем, хотя его
# возможности (`sso`, `siem-export`, `offline-license`, `attestation`) уже
# написаны и включаются лицензией.
#
# ---------------------------------------------------------------------------
# Решение о цепочке наследования — замер, а не удобство
# ---------------------------------------------------------------------------
# `tools/release/relcommon.py` до этой работы разрешал ровно ОДНО звено и
# отказывал явно: «манифест-основание … сам наследует другой: цепочка
# наследования не поддерживается». Замер 25.10.2026 подтвердил отказ.
#
# Путей было два:
#
#   1. наследовать Community и объявить `pro/` и `enterprise/` поимённо;
#   2. наследовать Pro, разрешив цепочку из двух звеньев явным свойством.
#
# Выбран второй, по трём измеряемым причинам:
#
#   * свойство «манифест издания N+1 = манифест издания N + объявленная папка»
#     проверяемо ТОЛЬКО если у N+1 есть основание N. При пути 1 основанием
#     Enterprise оказывается Community, и тогда «+ объявленная папка» — это ДВЕ
#     папки (`pro/` и `enterprise/`), то есть в проверке состава появляется
#     третий класс файлов: «из чужой папки издания, но законный». Ослабление
#     этой проверки и есть цена пути 1;
#   * при пути 1 состав Enterprise не следует за Pro: если Pro добавит файл в
#     свою папку, Enterprise его не получит, и расхождение не видно глазами —
#     ровно тот дефект, ради которого введено наследование;
#   * цена пути 2 измерена: два звена вместо одного и +25 строк в
#     `relcommon.py` (измерение глубины и обязательное объявление
#     `inherit_chain`). Длина цепочки ОБЪЯВЛЯЕТСЯ (`inherit_chain = 2`), поэтому
#     вопрос «где кончаются правила» отвечается по файлу, а не по памяти;
#     предел `MAX_INHERIT_DEPTH = 2` проверяется вызовом.
#
# Третье звено (четвёртое издание) потребует отдельного решения: предел молча не
# поднимается.

[release]
product = "RAGRAF Enterprise"
# Основание — поставка Pro: Enterprise = Pro + своя папка.
inherits = "tools/release/manifest-pro.toml"
# Длина цепочки в звеньях: Enterprise наследует Pro (1), Pro наследует
# Community (2). Объявлена явно: без объявления загрузчик отказывает, и это
# правильно — «где кончаются правила» должно читаться из файла.
inherit_chain = 2

# ---------------------------------------------------------------------------
# Закрытые материалы Enterprise
#
# Каталог `enterprise/` объявлен удерживающим в `editions/editions.toml`
# (`[retained]`): в публикацию Community он не входит никогда. Здесь он
# публикуется — это и есть то, что Enterprise добавляет к Pro:
#
#   * `enterprise/ENTERPRISE-DELIVERY.md` — документ поставки: состав, права,
#     что удержано, чем Enterprise отличается от Pro;
#   * `enterprise/inventory.toml` — машинный инвентарь прав, сверяется с
#     `src/ragraf/edition_baseline.json` свойством, а не обещанием;
#   * `enterprise/README.md` — граница между изданиями и обязательства продавца.
# ---------------------------------------------------------------------------

[[include]]
from = "enterprise"
to = "enterprise"
kind = "tree"

# ---------------------------------------------------------------------------
# Чего в поставке Enterprise быть не может ни при каком расширении этого файла:
#
#   * секретоносные пути (`catalog/db_access.json`, `catalog/secrets.key`,
#     лицензии и ключи подписи) — не входят ни в одну поставку: отсекаются
#     унаследованными правилами плюс проверкой имени пути;
#   * локальные настройки этой машины (`config/*.local.*`);
#   * `archive/**` — хранилище вырезанного: единственная рабочая копия снятой
#     функциональности, публикации не подлежит;
#   * материалы Community, которые уже публикует Pro, — они приходят по
#     наследованию, а не повтором.
# ---------------------------------------------------------------------------
