[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragraf"
# Версия объявлена ОДИН раз — в `src/ragraf/__init__.py` (`__version__`).
# Здесь она не повторяется: `dynamic` + `tool.setuptools.dynamic` читают её
# оттуда, поэтому метаданные пакета не могут разойтись с кодом. Замер
# 24.10.2026: до этого версия стояла в трёх местах (здесь, в `__init__.py`
# и в `CITATION.cff`), и все три пришлось бы поднимать вручную.
dynamic = ["version"]
description = "RAGRAF — графово-векторная база знаний о коде для LLM-агентов"
readme = "README.md"
requires-python = ">=3.13"
license = "BUSL-1.1"
# ВНИМАНИЕ: идентификатор лицензии — именно BUSL-1.1. Написание `BSL-1.1`
# сборка отвергает (InvalidLicenseExpression: Unknown license), проверено
# вызовом 24.10.2026. Нижняя граница setuptools поднята до 77, потому что
# license-files и выражение лицензии — это PEP 639; на 69–76 метаданные
# собирались бы иначе и результат зависел бы от машины.
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Mikhail Deynekin", email = "mid1977@gmail.com" },
]
keywords = ["code-analysis", "knowledge-graph", "vector-search", "llm-agents", "mcp", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
# Классификатор лицензии здесь СОЗНАТЕЛЬНО отсутствует: по PEP 639 выражение
# `license = "MIT"` и старый классификатор «License :: OSI Approved :: MIT License»
# несовместимы, и setuptools отвергает сборку целиком
# (InvalidConfigError: «License classifiers have been superseded by license
# expressions»). Проверено запуском 12.10.2026: с классификатором
# `pip install -e .` падал на стадии разбора требований.
dependencies = [
    "PyYAML>=6.0,<7.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-language-pack>=1.20,<2.0",
    "sqlite-vec>=0.1.9,<0.2",
    "fastembed>=0.8,<0.9",
    "ijson>=3.5,<4.0",
    "tiktoken>=0.14,<0.15",
]

# Дополнительные наборы.
# tls — системное хранилище сертификатов для загрузки модели эмбеддингов.
#   Нужен там, где в сети стоит TLS-инспекция (корпоративный прокси):
#   без него загрузка модели падает на 'certificate verify failed'.
#   Измерено 12.10.2026 на Windows: без пакета — отказ, с пакетом — 240 МБ
#   скачиваются за 9,2 с. В домашней сети не требуется.
[project.optional-dependencies]
tls = ["truststore>=0.10"]
# Секреты: хранилище использует PyNaCl (SecretBox + Ed25519-подпись наборов).
# Объявлено 24.10.2026: до этого библиотека стояла на машине, но не была
# объявлена, поэтому SBOM по объявленным зависимостям её не видел, а офлайн-набор
# не привёз бы её в закрытый контур — хранилище там отказало бы с причиной
# crypto_missing. Без набора RAGRAF работает, но хранилище недоступно.
secrets = ["PyNaCl>=1.5"]
# Подпись утверждений SSO: `src/ragraf/sso.py` проверяет RS256/RS384/RS512 и
# ES256/ES384/ES512 через `cryptography`, и без неё проверка подписи отказывает
# с причиной (`cryptography_missing`), хотя сама библиотека подписи наборов
# стоит. Измеренный долг ПРОМТ-И7, объявленный здесь: пока зависимость не была
# объявлена, офлайн-набор её не привозил, и единый вход в закрытом контуре
# отказывал бы на любом токене, кроме EdDSA.
cryptography = ["cryptography>=42"]
# Документы: PDF, DOCX, XLSX, PPTX (G5). Без них язык `document` даёт
# metadata_only с причиной, а не падает: зависимости необязательны.
documents = [
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/paulmann/RAGRAF"
Repository = "https://github.com/paulmann/RAGRAF"
Issues = "https://github.com/paulmann/RAGRAF/issues"

[project.scripts]
ragraf = "ragraf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ragraf*"]

[tool.setuptools.dynamic]
# Единственное место объявления версии — атрибут `__version__` в пакете.
# setuptools читает его статически (AST), не исполняя модуль.
version = { attr = "ragraf.__version__" }

[tool.setuptools.package-data]
# Базовая линия изданий — ДАННЫЕ, и они обязаны быть в пакете: без файла слой
# изданий не разрешается (fail-closed), то есть ни одна операция не работает.
# Объявлено явно, а не «попадёт как-нибудь»: проверено сборкой колеса.
ragraf = ["edition_baseline.json"]
