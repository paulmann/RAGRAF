# RAGRAF Enterprise — манифест ЕДИНСТВЕННОЙ закрытой поставки.
#
# Решение владельца 26.10.2026: пользователь Enterprise при переходе с Pro не
# устанавливает ничего — активирует лицензию, и функции расширяются. Значит
# коммерческая поставка одна, а Pro — УРОВЕНЬ ЛИЦЕНЗИИ внутри неё, а не другой
# пакет.
#
# Что из этого следует для манифеста:
#
#   * цепочка наследования короткая: Community → Enterprise (inherit_chain = 1).
#     Прежняя цепочка из двух звеньев существовала ровно потому, что Pro был
#     отдельной поставкой; теперь звено одно, и это видно по файлу, а не по памяти;
#   * закрытые модули объявляются ЗДЕСЬ и в том же поле `pro_only`: оно означает
#     «файл лежит в общем дереве, но в Community-сборку не входит», а не «принадлежит
#     изданию Pro». Имя поля оставлено: переименование сломало бы проверку в обе
#     стороны (`check_pro_delivery.py`), не добавив ни одного свойства;
#   * в пакете едет одна закрытая папка `enterprise/`: документ поставки, документ
#     уровня Pro, единый инвентарь прав;
#   * сборка ОДНА: что из платных возможностей работает, решает подписанный файл
#     лицензии (гейт `src/ragraf/edition.py`), а не другой бинарник.
#
# Почему наследование, а не копия правил. Копия шестидесяти включений и тридцати
# исключений расходится на первой правке, и расхождение не видно глазами: сборка
# просто перестала бы совпадать с Community по составу.

[release]
product = "RAGRAF Enterprise"
# Основание — манифест Community: всё остальное объявлено здесь.
inherits = "tools/release/manifest.toml"
# Длина цепочки в звеньях: Enterprise наследует Community (1). Объявлена явно:
# без объявления загрузчик отказывает, и это правильно — «где кончаются правила»
# должно читаться из файла.
inherit_chain = 1

# Закрытые модули поставки (бывший список Pro + модули Enterprise). Каждое
# объявление проверяется в обе стороны: файл обязан быть в этой поставке и обязан
# отсутствовать в Community-сборке.
pro_only = [
    "src/ragraf/shared_index.py",
    "tests/test_shared_index.py",
    "src/ragraf/sso.py",
    "src/ragraf/siem.py",
    "src/ragraf/attest.py",
    "src/ragraf/license_offline.py",
    "tests/test_external_access.py",
    "tests/test_offline_attest.py",
    "src/ragraf/quality_loop.py",
    "tests/test_quality_loop.py",
    # Брокер секретов (этап И18): служба выдачи по запросу и плановой смены.
    # Хранилище (`vault.py`) остаётся в Community — платное здесь служба.
    "src/ragraf/broker.py",
    "tests/test_broker.py",
]

# Закрытые материалы поставки: документ, инвентарь прав, уровень Pro.
# В публикацию Community папка не входит никогда (`editions/editions.toml`,
# `[retained]`).

[[include]]
from = "enterprise"
to = "enterprise"
kind = "tree"

# ---------------------------------------------------------------------------
# Чего в поставке Enterprise быть не может ни при каком расширении этого файла:
#
#   * секретоносные пути (`catalog/db_access.json`, `catalog/secrets.key`,
#     лицензии и ключи подписи) — не входят ни в одну поставку: отсекаются
#     унаследованными правилами плюс проверкой имени пути;
#   * локальные настройки этой машины (`config/*.local.*`);
#   * `archive/**` — хранилище вырезанного: единственная рабочая копия снятой
#     функциональности, публикации не подлежит;
#   * материалы Community, которые уже публикует Pro, — они приходят по
#     наследованию, а не повтором.
# ---------------------------------------------------------------------------
