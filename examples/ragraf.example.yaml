# Пример конфигурации корпуса RAGRAF.
#
# Это ШАБЛОН, а не рабочий конфиг: путь `root` ниже — заглушка. Свой конфиг
# под конкретный проект создаётся командой, которая осматривает каталог и
# подбирает языки, исключения и пороги по фактическому содержимому:
#
#     ragraf init C:\путь\к\проекту
#
# Команда печатает путь созданного файла. После init проверьте два списка —
# `include` и `exclude`: от них зависит, что попадёт в индекс. Особое внимание
# на каталоги с секретами (`config.local.*`, `.env`, ключи) — они не должны
# индексироваться.
#
# Затем зарегистрировать и построить индекс:
#
#     ragraf -p examples/mycorpus.yaml register
#     ragraf -p examples/mycorpus.yaml index
#
# Либо одной командой всё сразу (найти корпус, пересобрать отставший индекс,
# создать корпус для незнакомого каталога):
#
#     ragraf ensure C:\путь\к\проекту
#
# Где окажется индекс: в каталоге `.ragraf/` ВНУТРИ индексируемого проекта.
# Это машинно-локальные производные данные — добавьте `.ragraf/` в .gitignore
# того репозитория.

project: myproject
root: C:/path/to/your/project

# Языки, файлы которых попадают в индекс. Разбор деревом (узлы и рёбра графа)
# доступен для 16 языков; остальные подключаются текстом — файлы находятся
# поиском, но узлов не дают. Полный перечень — в README.md.
#
# Команда `init` заполняет список по фактическому содержимому каталога.
# Если в проекте есть скрипты .ps1, .sh, .bat или код .cs, .py, .pl —
# убедитесь, что их языки здесь есть, иначе файлы не индексируются.
languages:
  - python
  - javascript
  - markdown

# Что индексировать: маски файлов. Значения по умолчанию для Python-проекта.
include:
  - "**/*.py"
  - "**/*.js"
  - "**/*.md"

# Что исключать. Базовый список (история, зависимости, сборка, кеши, а также
# собственный каталог .ragraf) применяется ВСЕГДА и не заменяется этим списком:
# правила отсюда ДОБАВЛЯЮТСЯ к базовым.
exclude:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/build/**"
  - "**/dist/**"

# Файлы с секретами: не индексируются, содержимое не читается.
secrets_exclude:
  - "**/*.local.php"
  - "**/.env"
  - "**/*.pem"

# Схема БД из миграций (когда в проекте есть migrations/*.sql).
db:
  enabled: false

embedding:
  # Модель локальная, работает без облака. ~240 МБ, скачивается один раз
  # при первой индексации с векторами в <домашний каталог>/.ragraf/models.
  # Переопределить каталог кэша: переменная окружения RAGRAF_MODEL_CACHE.
  # Индексация без модели: ragraf index --no-vectors (лексика продолжит работать).
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
  batch_size: 64
  use_gpu: false
  device: auto

chunking:
  by_symbol: true
  max_chunk_lines: 120
  min_chunk_lines: 3

index:
  # Сколько ревизий хранить. Старые не удаляются из истории: помечаются
  # rotated, чистятся только данные графа и лексики.
  retain_revs: 3
  batch_size: 2000
  # Граф свойств кода (межпроцедурные вызовы) требует Java и Joern.
  # Без них индекс строится, но capability=degraded: операция slice
  # отказывает с причиной, остальные работают.
  joern_enabled: true
  joern_server: true
  joern_server_port: 9500
  joern_heap_gb: 8
  # Автоподбор порогов переиндексации по накоплению правок.
  reindex_after_changes: 5
  full_reindex_after_changes: 20
  reindex_interval_minutes: 15
