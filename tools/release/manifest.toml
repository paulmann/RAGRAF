# ---------------------------------------------------------------------------
# 3. Исключения. Поле `state`:
#      active — правило сейчас отсекает хотя бы один файл;
#      guard  — сейчас не отсекает ничего, но страхует будущее расширение
#               манифеста (например, если в него попадёт корень дерева).
#    Число отсечённых файлов печатает сборщик; проверка сверяет пометку с фактом.
# ---------------------------------------------------------------------------

[[exclude]]
pattern = "**/__pycache__/**"
state = "active"
why = "кеш байткода Python: пересобирается, к версии интерпретатора привязан, в поставке бесполезен"

[[exclude]]
pattern = "**/*.pyc"
state = "guard"
why = "скомпилированный байткод рядом с исходником: дублирует то, что и так есть текстом"

[[exclude]]
pattern = "**/*.bak"
state = "guard"
why = "резервная копия файла: история правок этой машины, а не содержимое версии"

[[exclude]]
pattern = "**/*.bak.*"
state = "guard"
why = "резервная копия с расширением исходного файла (так сохраняет правки инструмент очистки)"

[[exclude]]
pattern = "**/*.bak-*"
state = "guard"
why = "резервная копия с меткой задачи в имени (file.md.bak-20261024-stage3). Копий в дереве больше нет — раз все сняты по §8.23, правило работает страховкой на будущее"

[[exclude]]
pattern = "**/*.orig"
state = "guard"
why = "копия до слияния: содержит конфликтные маркеры и не является рабочим файлом"

[[exclude]]
pattern = "**/*.old"
state = "guard"
why = "прежняя версия файла: публиковать две версии одного документа значит раздвоить факт"

[[exclude]]
pattern = "**/*.save"
state = "guard"
why = "сохранённая копия: то же содержимое под нерабочим именем"

[[exclude]]
pattern = "**/*.rej"
state = "guard"
why = "отклонённая часть заплатки: рабочий мусор инструмента патчей"

[[exclude]]
pattern = "**/*.tmp"
state = "active"
why = "временный файл: содержимое недописано по определению"

[[exclude]]
pattern = "**/~$*"
state = "guard"
why = "временный файл офисного пакета: появляется при открытии документа в редакторе, к версии не относится"

# Измеренный дефект 24.10.2026: tests/test_access_live_out.txt содержит
# выданный токен доступа панели (значение не печатается ни в отчётах, ни здесь).
# Файл — журнал прогона, а не исходник: в поставку он попадать не должен.
# Общее правило по маске выбрано намеренно: таких журналов два, и следующий
# прогон создаст третий с другим именем.
[[exclude]]
pattern = "tests/*_out.txt"
state = "active"
why = "журнал прогона теста: содержит выданный токен доступа панели и локальные пути машины"

[[exclude]]
pattern = "**/*.egg-info/**"
state = "guard"
why = """метаданные сборки пакета: пересоздаются установкой и сборкой колеса, версию не
описывают. Сейчас их в дереве нет, поэтому пометка guard, а не active: проверка
требует, чтобы active что-то отсекал. Замер 24.10.2026 (этап И6): сборка колеса в
живом дереве создала src/ragraf.egg-info, и правило действительно отсекло файлы —
то есть оно работает, просто обычно отсекать нечего"""

[[exclude]]
pattern = "build/**"
state = "guard"
why = """выход сборки пакета: setuptools кладёт сюда копию src перед упаковкой. Сейчас
каталога нет, поэтому guard. Замер 24.10.2026 (этап И6): сборка колеса в живом
дереве оставила build/lib/ragraf/** — 64 файла, и проверка поставки назвала их
«файлами без места». Копии исходников в поставку попадать не должны"""

# ---------------------------------------------------------------------------
# 13. Закрытый модуль Pro (ПРОМТ-И15, 25.10.2026).
#
# Общий индекс команды (`src/ragraf/shared_index.py`) — первая платная
# возможность, которая живёт ФАЙЛОМ, а не операцией в общем коде. В
# Community-сборке его нет вовсе: граница издания — отсутствие кода, а не
# проверка права в рантайме (проверку можно обойти, отсутствие файла — нет).
#
# Возврат в закрытую поставку объявлен в `tools/release/manifest-enterprise.toml`
# полем `pro_only` —
# ОДНИМ объявлением, потому что оно и публикует файл в Pro, и требует его
# отсутствия здесь (проверяется `check_pro_delivery.py` в обе стороны).
#
# Проверка модуля исключена вместе с кодом: тест импортирует модуль, и в
# Community он падал бы на импорте — то есть красил бы CI чужого клона за то,
# чего в этом издании нет.
# ---------------------------------------------------------------------------

[[exclude]]
pattern = "src/ragraf/shared_index.py"
state = "active"
why = "закрытый модуль закрытой поставки: общий индекс команды. Возвращается объявлением pro_only в manifest-enterprise.toml"

[[exclude]]
pattern = "tests/test_shared_index.py"
state = "active"
why = "проверка закрытого модуля Pro: импортирует src/ragraf/shared_index.py, которого в Community нет"


# ---------------------------------------------------------------------------
# Закрытые модули платных изданий (решение владельца 25.10.2026).
#
# Граница издания — ОТСУТСТВИЕ КОДА, а не проверка права в рантайме: проверку
# можно обойти, отсутствие файла — нет. Все четыре модуля вызываются из фасада
# только через `_feature_module("<операция>", "<модуль>", "<возможность>")`,
# поэтому их отсутствие даёт отказ с названной причиной, а не падение.
#
# `src/ragraf/quality.py` СОЗНАТЕЛЬНО ОСТАВЛЕН: базовая операция `index_status`
# читает из него `measures`, `journal_stats` и `prune_keep_default`
# (src/ragraf/facade.py:2175-2198). Вырезание файла целиком ломало бы базовую
# операцию Community. Разделение файла на «измерение» и «контур качества» —
# отдельный этап, названный в отчёте.
# ---------------------------------------------------------------------------

[[exclude]]
pattern = "src/ragraf/sso.py"
state = "active"
why = "закрытый модуль Enterprise: единый вход. Объявлен в pro_only манифестов pro и enterprise"

[[exclude]]
pattern = "src/ragraf/siem.py"
state = "active"
why = "закрытый модуль Enterprise: экспорт аудита в SIEM. Объявлен в pro_only манифестов pro и enterprise"

[[exclude]]
pattern = "src/ragraf/attest.py"
state = "active"
why = "закрытый модуль Enterprise: аттестация сборки. Объявлен в pro_only манифестов pro и enterprise"

[[exclude]]
pattern = "src/ragraf/license_offline.py"
state = "active"
why = "закрытый модуль Enterprise: офлайн-лицензия и её выпуск. Объявлен в pro_only манифестов pro и enterprise"





[[exclude]]
pattern = "src/ragraf/quality_loop.py"
state = "active"
why = "закрытый модуль Pro/Enterprise: контур качества (suite/diff/prune). Измерение индекса осталось в quality.py — его читает базовая операция index_status"

[[exclude]]
pattern = "tests/test_quality_loop.py"
state = "active"
why = "проверка закрытого модуля: импортирует src/ragraf/quality_loop.py, которого в Community нет"

[[exclude]]
pattern = "src/ragraf/broker.py"
state = "active"
why = "закрытый модуль закрытой поставки: брокер секретов (выдача по запросу и плановая смена). Хранилище секретов остаётся в Community — платное здесь служба. Возвращается объявлением pro_only в manifest-enterprise.toml"

[[exclude]]
pattern = "tests/test_broker.py"
state = "active"
why = "проверка закрытого модуля: импортирует src/ragraf/broker.py, которого в Community нет"

[[exclude]]
pattern = "tests/test_external_access.py"
state = "active"
why = "проверка закрытых модулей sso/siem. Объявлен в pro_only манифестов pro и enterprise"

[[exclude]]
pattern = "tests/test_offline_attest.py"
state = "active"
why = "проверка закрытых модулей attest/license_offline. Объявлен в pro_only манифестов pro и enterprise"

[[exclude]]
pattern = "docs/AGENTS-context.md"
state = "active"
why = "внутренний материал проекта: адресован агенту этой машины, а не читателю поставки"

[[exclude]]
